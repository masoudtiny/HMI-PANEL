<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ساخت هش رمز</title>
<style>body{font-family:Tahoma,Arial;background:#222;color:#eee;padding:20px;max-width:460px;margin:auto}
input,textarea,button{width:100%;box-sizing:border-box;padding:10px;font-size:16px;margin-top:10px;border-radius:8px;border:1px solid #65c8e8;background:#11161b;color:#fff;direction:ltr}
button{background:#65c8e8;color:#111;font-weight:700;cursor:pointer}</style></head><body>
<h3>ساخت هش رمز</h3>
<p>رمز دلخواه را بنویس، دکمه را بزن، و هش را داخل <code>index.html</code> به جای مقدار <code>PASS_HASH</code> بگذار.</p>
<input id="p" type="text" placeholder="رمز جدید">
<button onclick="o.value=sha256('HMI::'+p.value)">ساخت هش</button>
<textarea id="o" rows="3" readonly></textarea>
<script>
function sha256(str){
    function R(n,x){return (x>>>n)|(x<<(32-n));}
    const K=[],H=[];let c=0;
    function frac(x){return ((x-Math.floor(x))*4294967296)|0;}
    for(let n=2;c<64;n++){let pr=true;for(let i=2;i*i<=n;i++)if(n%i===0){pr=false;break;}
        if(pr){if(c<8)H[c]=frac(Math.pow(n,.5));K[c]=frac(Math.pow(n,1/3));c++;}}
    const b=unescape(encodeURIComponent(str));const l=b.length;const w=[];
    for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
    w[l>>2]|=0x80<<(24-(l%4)*8);
    w[(((l+8)>>6)<<4)+15]=l*8;
    for(let j=0;j<w.length;j+=16){
        const a=H.slice(0),x=[];
        for(let i=0;i<64;i++){
            if(i<16)x[i]=w[j+i]|0;else{
                const s0=R(7,x[i-15])^R(18,x[i-15])^(x[i-15]>>>3),s1=R(17,x[i-2])^R(19,x[i-2])^(x[i-2]>>>10);
                x[i]=(x[i-16]+s0+x[i-7]+s1)|0;}
            const S1=R(6,a[4])^R(11,a[4])^R(25,a[4]),ch=(a[4]&a[5])^(~a[4]&a[6]);
            const t1=(a[7]+S1+ch+K[i]+x[i])|0;
            const S0=R(2,a[0])^R(13,a[0])^R(22,a[0]),mj=(a[0]&a[1])^(a[0]&a[2])^(a[1]&a[2]);
            const t2=(S0+mj)|0;
            a.pop();a.unshift((t1+t2)|0);a[4]=(a[4]+t1)|0;
        }
        for(let i=0;i<8;i++)H[i]=(H[i]+a[i])|0;
    }
    return H.map(v=>("00000000"+(v>>>0).toString(16)).slice(-8)).join("");
}

</script></body></html>

<script>
/* رمز عبور: هش SHA-256 از ("HMI::" + رمز). برای عوض کردن رمز، فایل make_hash.html را باز کنید و هش جدید را اینجا بگذارید */
const PASS_HASH = "8515968bf0d987a8ae8783c12a8597c78756948ba8dc7df85c2e20e9231a1d4d";
function sha256(str){
    function R(n,x){return (x>>>n)|(x<<(32-n));}
    const K=[],H=[];let c=0;
    function frac(x){return ((x-Math.floor(x))*4294967296)|0;}
    for(let n=2;c<64;n++){let pr=true;for(let i=2;i*i<=n;i++)if(n%i===0){pr=false;break;}
        if(pr){if(c<8)H[c]=frac(Math.pow(n,.5));K[c]=frac(Math.pow(n,1/3));c++;}}
    const b=unescape(encodeURIComponent(str));const l=b.length;const w=[];
    for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
    w[l>>2]|=0x80<<(24-(l%4)*8);
    w[(((l+8)>>6)<<4)+15]=l*8;
    for(let j=0;j<w.length;j+=16){
        const a=H.slice(0),x=[];
        for(let i=0;i<64;i++){
            if(i<16)x[i]=w[j+i]|0;else{
                const s0=R(7,x[i-15])^R(18,x[i-15])^(x[i-15]>>>3),s1=R(17,x[i-2])^R(19,x[i-2])^(x[i-2]>>>10);
                x[i]=(x[i-16]+s0+x[i-7]+s1)|0;}
            const S1=R(6,a[4])^R(11,a[4])^R(25,a[4]),ch=(a[4]&a[5])^(~a[4]&a[6]);
            const t1=(a[7]+S1+ch+K[i]+x[i])|0;
            const S0=R(2,a[0])^R(13,a[0])^R(22,a[0]),mj=(a[0]&a[1])^(a[0]&a[2])^(a[1]&a[2]);
            const t2=(S0+mj)|0;
            a.pop();a.unshift((t1+t2)|0);a[4]=(a[4]+t1)|0;
        }
        for(let i=0;i<8;i++)H[i]=(H[i]+a[i])|0;
    }
    return H.map(v=>("00000000"+(v>>>0).toString(16)).slice(-8)).join("");
}
document.getElementById("gateForm").addEventListener("submit",function(e){
    e.preventDefault();
    const v=document.getElementById("gatePass").value;
    if(sha256("HMI::"+v)===PASS_HASH){
        document.getElementById("gate").remove();
        document.body.classList.remove("locked");
        window.dispatchEvent(new Event("resize"));
    }else{
        document.getElementById("gateErr").textContent="رمز اشتباه است";
        document.getElementById("gatePass").value="";
    }
});
</script>

function saveCurrentPage() {
    pageHistory.push({ key: currentPage.key, image: currentPage.image, state: currentPage.state });
    if (pageHistory.length > MAX_HISTORY) pageHistory.shift();
}
function navigateTo(key, image, state) {
    if (currentPage.key === key && currentPage.image === image) return;
    saveCurrentPage();
    currentPage = { key, image, state };
    panelImage.src = image;

    hmiPanel.classList.remove("page-module");
    if (MODULE_PAGES.includes(key)) hmiPanel.classList.add("page-module");

    hideHmiTooltip();
    if (typeof hideLabels === "function") hideLabels();
    restorePageState(state);
}

function restorePageState(state) {
    hideAllSpecial();
    hmiPanel.classList.remove("hide-nav");
    const cb0 = document.querySelector(".close-popup-button");
    if (cb0) { cb0.style.left = ""; cb0.style.top = ""; cb0.style.width = ""; cb0.style.height = ""; }
    if (state === "layout") { showMainMenu(); showLayoutButtons(); }
    else if (state === "normal") {
        if (MODULE_PAGES.includes(currentPage.key)) { 
            const cb = document.querySelector(".close-popup-button");
            if (cb) { cb.style.left = ""; cb.style.top = ""; cb.style.width = ""; cb.style.height = ""; }
            if (BR_POPUP_PAGES.includes(currentPage.key)) {   /* پاپ‌آپ مارک‌خوان: فقط ضربدر (برگشت به صفحه ماژول) */
                showSelectors([".close-popup-button"]);
                if (cb) { cb.style.left = "709px"; cb.style.top = "77px"; cb.style.width = "29px"; cb.style.height = "29px"; }
            } else {
                showSelectors(moduleButtons); 
                showSelectors(motorSelectorsForPage(currentPage.key)); 
            }
        } else if (/^BUFFER /.test(currentPage.key)) {
            showSelectors([".close-popup-button"]);
        } else if (/^B[PC]\d\d(?:-.+)?$/.test(currentPage.key)) {
            // ✅ ضربدر فقط برای صفحاتی که توی لیست استثنا نیستن
            const hideClose = NO_CLOSE_BUTTON_PAGES.some(p => currentPage.key.startsWith(p));
            if (!hideClose) {
                showSelectors([".close-popup-button"]);
            }
        }
    }
    else if (state === "axes") { showButtons([".page-button"]); }
    else if (state === "vision-system") showSelectors(visionButtons);
    else if (state === "pressure-sensors") showSelectors(pressureSensorButtons);
    else if (state === "vacuum-sensors") showSelectors(vacuumSensorButtons);
    else if (state === "glue-sensors") showSelectors(glueSensorButtons);
    else if (state === "ifm-sensors") showSelectors(ifmButtons);
    else if (state === "asynchronous-motors") showSelectors([".asynchronous-motors-page2"]);
    else if (state === "asynchronous-motors-page2") showSelectors([".asynchronous-motors-page1"]);
    else if (state === "print-registration") showSelectors(printRegistrationButtons);
    else if (state === "unwinders") showSelectors([".unwinder-position-button"]);
    else if (state === "unwinder-setup") {
        const sel = unwinderBufferPageMap[currentPage.key];
        if (sel) showSelectors([sel]);
    }
    else if (state === "module-phasing") showSelectors(modulePhasingButtons);
    else if (state === "melter") { showSelectors(melterButtons); showSelectors(melterPumpButtons); }
    else if (state === "melter-page") {
        showSelectors(melterButtons);
        const pages = { "Melter PAGE 1":melterPumpButtons, "Melter PAGE 2":melterPage2Buttons, "Melter PAGE 3":melterPage3Buttons,
                        "Melter PAGE 4":melterPage4Buttons, "Melter PAGE 5":melterPage5Buttons, "Melter PAGE 6":melterPage6Buttons };
        if (pages[currentPage.key]) showSelectors(pages[currentPage.key]);
    }
    else if (state === "melter-phase") {
        const m = currentPage.key.match(/^MELTER (\d+) PHASE?$/);
        if (m) showSelectors([".melter" + m[1] + "-image"]);
        if (currentPage.key === "MELTER 5 PHASE") showSelectors(melter5PhaseExtraButtons);
    }
    else if (state === "melter5-page2") showSelectors(melter5Page2Buttons);
    else if (state === "valves") showSelectors(valvesButtons);
    else if (state === "valves-page2") showSelectors(valvesPage2Buttons);
    else if (state === "micro-reed") showSelectors(microReedButtons);
    else if (state === "micro-reed-page2") showSelectors(microReedPage2Buttons);
    else if (state === "proportional-valve") showSelectors(proportionalValveButtons);
    else if (state === "proportional-valve-page2") showSelectors(proportionalValvePage2Buttons);
    else if (state === "temperature-control" || state === "temperature-page") showTemperatureButtons([".temp-page1",".temp-page2",".resistances-check-button"]);
    else if (state === "resistances-check") showTemperatureButtons([".resistance-page1",".resistance-page2",".temperature-control-return-button"]);
    else if (state === "working-data-main") { showButtons([".current-shift-working-data",".knife-counters-working-data"]); }
    else if (state === "current-shift") { showButtons([".shift1-current-shift",".shift2-current-shift",".main-counter-current-shift"]); }
    else if (state === "shift1") { showButtons([".current-shift-shift1",".shift1-shift1",".shift2-shift1",".main-counter-shift1"]); }
    else if (state === "shift2") { showButtons([".current-shift-shift2",".shift1-shift2",".shift2-shift2",".main-counter-shift2"]); }
    else if (state === "active-alarm") showSelectors(activeAlarmButtons);
    else if (state === "alarm-list") showSelectors(alarmListButtons);
    else if (state === "warning-list") showSelectors(warningListButtons);
    else if (state === "alarm-popup") {   /* پاپ‌آپ تاریخچه: فقط ضربدر (برگشت) و بدون کلیدهای سنسور تا شیر */
        hmiPanel.classList.add("hide-nav");
        const cb = document.querySelector(".close-popup-button");
        showSelectors([".close-popup-button"]);
        if (cb) { cb.style.left = "908px"; cb.style.top = "61px"; cb.style.width = "24px"; cb.style.height = "22px"; }
    }
    else if (state === "profinet") { showButtons([".advanced-diagnostic"]); }
    else if (state === "mechanical") { 
        /* ✅ فقط دکمه‌های هومینگ نمایش داده می‌شوند — هیچ دکمه‌ای از Layout بالای صفحه نمی‌آید */
        showSelectors(mechanicalButtons); 
    }
}

function goBack() {
    if (pageHistory.length === 0) return;
    const prev = pageHistory.pop();
    currentPage = { key: prev.key, image: prev.image, state: prev.state };
    panelImage.src = prev.image;
    hmiPanel.classList.remove("page-module");
    if (MODULE_PAGES.includes(prev.key)) hmiPanel.classList.add("page-module");
    hideHmiTooltip();
    hideLabels();
    restorePageState(prev.state);
}
function goHome(addToHistory = true) {
    if (currentPage.key === "Layout") { restorePageState("layout"); return; }
    if (addToHistory) saveCurrentPage();
    currentPage = { key:"Layout", image:"images/Layout.png", state:"layout" };
    panelImage.src = "images/Layout.png";
    hmiPanel.classList.remove("page-module");
    hideHmiTooltip();
    hideLabels();
    restorePageState("layout");
}

            ["3142B1 (M23)","وجود ماده بعد از اسپلایس"],["3143B1 (M08)","وجود ماده هشتم بعد از کشش"]],
        "HOOK":[
            ["3162B1 (M23)","وجود ماده بعد از اسپلایس"],["3163B1 (M08)","وجود ماده نهم بعد از کشش"],
            ["3163B3\\B4 (M07)","وجود هوک قبل از اتصال"],["3163B7 (M06)","وجود ماده قبل از کشش"]],
        "FRONT EARS":[
            ["3222B1 (M24)","وجود ماده بعد از اسپلایس"],["3223B1 (M10)","وجود ماده دوازدهم بعد از کشش"],
            ["3223B3/B4 (M09)","وجود ماده دوازدهم قبل از برش و قرارگیری (Cut&Place)"]],
        "FRONTAL TAPE":[
            ["3262B1 (M25)","وجود ماده بعد از اسپلایس"],["3263B1 (M11)","وجود ماده چهاردهم بعد از کشش"],
            ["3263B3\\B4 (M11)","هم‌ترازی قبل از چسب حرارتی (هات‌ملت)"]],
        "NW BACKSHEET":[
            ["3282B1 (M26)","وجود ماده بعد از اسپلایس"],["3283B1 (M13)","وجود ماده پانزدهم بعد از کشش"],
            ["3283B3\\B4 (M12)","هم‌ترازی قبل از S10P2 - لمینه فویل"]],
        "POLY BKSHEET":[
            ["3302B1 (M26)","وجود ماده بعد از اسپلایس"],["3303B1 (M14)","وجود ماده شانزدهم بعد از کشش"],
            ["3303B3\\B4 (M12)","هم‌ترازی قبل از اتصال"],["3303B5\\B6 (M10)","هم‌ترازی قبل از S9P2 - تقویت گوشی‌ها"]]
    };
    Object.keys(S).forEach(en => {
        const [num, fa] = UW[en];
        const Zp = (...a) => ZS(en + " SENSOR", AX, ...a);
        header(Zp, "UNWINDER " + pad2(num) + " SENSORS SET-UP", "تنظیمات سنسورهای آنویندر " + fa);
        Zp(185, 75, 297, 115, "ENABLE", "فعال / غیرفعال کردن سنسور");
        Zp(327, 75, 741, 115, "NAME", "کد و محل سنسور");
        Zp(771, 75, 882, 115, "THRESHOLD", "آستانه تشخیص سنسور (ppm)");
        const n = S[en].length;
        S[en].forEach(([code, d], i) => { const y = 142 + 47.5 * i; Zp(327, y-20, 741, y+20, code, d + "\n" + code); });
        Zp(185, 121, 297, 121 + 47.5 * n, "ENABLE", "فعال / غیرفعال کردن سنسور", "h");
        Zp(771, 121, 882, 121 + 47.5 * n, "THRESHOLD", "آستانه تشخیص سنسور (ppm)", "h");
    });
})();

let tooltipAnchor = null, tooltipLong = false;
const isLongZone = z => !!(z && z.long);
function findInfoZone(event){
    const list = INFO_ZONES[(currentPage.key || "").toLowerCase()];
    if (!list) return null;
    const r = hmiPanel.getBoundingClientRect(), k = 1000 / r.width;
    const x = (event.clientX - r.left) * k, y = (event.clientY - r.top) * k;
    return list.find(z => z.m !== "a" && x >= z.x1 && x <= z.x2 && y >= z.y1 && y <= z.y2) || null;
}
function zoneViewportRect(z){
    const r = hmiPanel.getBoundingClientRect(), k = r.width / 1000;
    return {left:r.left+z.x1*k, right:r.left+z.x2*k, top:r.top+z.y1*k, bottom:r.top+z.y2*k};
}
function positionHmiTooltip(event) {
    if (tooltipAnchor) {
        const a = tooltipAnchor, tw = hmiTooltip.offsetWidth, th = hmiTooltip.offsetHeight;
        const pw = window.innerWidth, ph = window.innerHeight;
        let left = (a.left + a.right) / 2 - tw / 2;
        let top = a.top - th - 6;
        if (top < 5) top = a.bottom + 6;
        if (top + th > ph - 5) top = Math.max(5, ph - th - 5);
        hmiTooltip.style.left = Math.max(5, Math.min(left, pw - tw - 5)) + "px";
        hmiTooltip.style.top = Math.max(5, top) + "px";
        return;
    }
    const mx = event.clientX, my = event.clientY;
    const tw = hmiTooltip.offsetWidth, th = hmiTooltip.offsetHeight;
    const pw = window.innerWidth, ph = window.innerHeight;
    let left = mx + 16, top = my + 16;
    if (left + tw > pw - 5) left = mx - tw - 16;
    if (top + th > ph - 5) top = my - th - 16;
    hmiTooltip.style.left = Math.max(5, Math.min(left, pw - tw - 5)) + "px";
    hmiTooltip.style.top = Math.max(5, Math.min(top, ph - th - 5)) + "px";
}

let touchHideTimer = null, touchDown = false;
/* ===== نمایش معنی همهٔ قسمت‌ها با یک لمس (فقط صفحه‌هایی که INFO_ZONES دارند، مثل Layout) ===== */
let labelsTimer = null;
function hideLabels(){
    clearTimeout(labelsTimer);
    hmiPanel.querySelectorAll(".hmi-label").forEach(e => e.remove());
    hmiPanel.classList.remove("labels-on");
}
function addLabel(x, y, w, h, text, minW, minH){
    if (!text || w < 6 || h < 6) return;
    const MINW = minW || 64, MINH = minH || 22;   /* کادرهای کوچک را بزرگ‌تر می‌کند تا متن ریز نشود */
    if (w < MINW) { x -= (MINW - w) / 2; w = MINW; }
    if (h < MINH) { y -= (MINH - h) / 2; h = MINH; }
    const d = document.createElement("div");
    d.className = "hmi-label";
    d.style.left = x + "px"; d.style.top = y + "px"; d.style.width = w + "px"; d.style.height = h + "px";
    d.textContent = text;
    if (/^[A-Z0-9][A-Za-z0-9 .()\/]* - /.test(text)) d.style.direction = "ltr";   /* انگلیسی (کد/نام) چپ، معنی فارسی راست */
    hmiPanel.appendChild(d);
    let fs = 14;
    d.style.fontSize = fs + "px";
    while (fs > 10 && (d.scrollHeight > d.clientHeight + 1 || d.scrollWidth > d.clientWidth + 1)) { fs--; d.style.fontSize = fs + "px"; }
    if (d.scrollHeight > d.clientHeight + 1 || d.scrollWidth > d.clientWidth + 1) d.style.overflow = "visible";
}
function showAllLabels(){
    hideLabels();
    hideHmiTooltip();
    hmiPanel.querySelectorAll("button").forEach(b => {
        if (getComputedStyle(b).display === "none") return;
        if (currentPage.key !== "Layout" && allMainButtons.some(sel => b.matches(sel))) return;   /* منوی بالای Layout فقط در Layout */
        const d = getTooltipDescription(b);
        if (!d[1]) return;
        /* Layout: کلید ماژول آنویندر را بالاتر (روی عکس کارت) و کلید تنظیمات را پایین‌تر می‌گذارد تا روی هم نیفتند */
        if (currentPage.key === "Layout" && [...b.classList].some(c => /^m2[0-6][abc]?$/.test(c))) {
            const cx = b.offsetLeft + b.offsetWidth / 2;
            addLabel(cx - 54, b.offsetTop - 46, 108, 40, d[1], 108, 40);
        } else if (currentPage.key === "Layout" && [...b.classList].some(c => /^m2[0-6][abc]?-setup$/.test(c))) {
            const cx = b.offsetLeft + b.offsetWidth / 2;
            addLabel(cx - 54, b.offsetTop - 1, 108, 26, d[1], 108, 26);
        } else addLabel(b.offsetLeft, b.offsetTop, b.offsetWidth, b.offsetHeight, d[1]);
    });
    (INFO_ZONES[(currentPage.key || "").toLowerCase()] || []).forEach(z => { if (z.m !== "h") addLabel(z.x1, z.y1, z.x2 - z.x1, z.y2 - z.y1, z.d); });
    hmiPanel.classList.add("labels-on");
    labelsTimer = setTimeout(hideLabels, 6000);
}
function pageHasLabels(){ return !!INFO_ZONES[(currentPage.key || "").toLowerCase()]; }
hmiPanel.addEventListener("pointerup", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (!pageHasLabels()) return;
    if (e.target.closest("button")) return;
    if (isLongZone(findInfoZone(e))) return;
    if (hmiPanel.querySelector(".hmi-label")) hideLabels(); else showAllLabels();
});

function showHmiTooltip(event) {
    let zone = null;
    tooltipLong = false;
    if ((event.pointerType === "touch" || event.pointerType === "pen") && pageHasLabels() && !event.target.closest("button") && !isLongZone(findInfoZone(event))) { hideHmiTooltip(); return; }
    if (event.pointerType === "touch" || event.pointerType === "pen") {
        clearTimeout(touchHideTimer);
        const onBtn = event.target.closest && event.target.closest("button");
        touchHideTimer = setTimeout(() => { if (!touchDown) hideHmiTooltip(); }, isLongZone(findInfoZone(event)) ? 15000 : 2000);
    }
    const button = event.target.closest("button");
    if (button && hmiPanel.contains(button) && !(currentPage.key !== "Layout" && allMainButtons.some(sel => button.matches(sel)))) {
        const d = getTooltipDescription(button);
        hmiTooltipTitle.textContent = d[0];
        hmiTooltipText.textContent = d[1];
        hmiTooltip.classList.remove("wide");
        tooltipAnchor = button.getBoundingClientRect();
    } else if ((zone = findInfoZone(event))) {
        hmiTooltipTitle.textContent = zone.t;
        if (isLongZone(zone)) { hmiTooltipText.innerHTML = zone.d; tooltipLong = true; } else hmiTooltipText.textContent = zone.d;
        hmiTooltip.classList.toggle("wide", isLongZone(zone));
        tooltipAnchor = zoneViewportRect(zone);
    } else if (pageHasLabels()) {
        /* صفحه‌هایی که برایشان معنی (ناحیه راهنما) اضافه شده: جدول کلی صفحه نمایش داده نشود */
        hideHmiTooltip();
        return;
    } else {
        tooltipAnchor = null;
        hmiTooltipTitle.textContent = currentPage.key || "HMI";

        let fullHelp = "";
        let isMotorPage = false;
        let isShortHelp = false;

        const motorMatch = currentPage.key.match(/^M\d+(?:-[A-C])?-[A-Z]{2}\d+$/);
        if (motorMatch) {
            fullHelp = PAGE_FULL_HELP["Axes Configuration"];
            isMotorPage = true;
        } else if (/^B[PC]\d\d(?:-.+)?$/.test(currentPage.key) && TOOLTIP_TEXTS[currentPage.key.toLowerCase()]) {
            const t = TOOLTIP_TEXTS[currentPage.key.toLowerCase()];
            fullHelp = t[0] + " - " + t[1];
            isShortHelp = true;
        } else {
            for (const k in PAGE_FULL_HELP) {
                if (HELP_KEY_PATTERN[k] ? HELP_KEY_PATTERN[k].test(currentPage.key) : currentPage.key.toUpperCase().startsWith(k.toUpperCase())) {
                    fullHelp = PAGE_FULL_HELP[k];
                    if (k === "Axes") {
                        const am = currentPage.key.match(/^Axes Page (\d+)$/i);
                        if ((am ? +am[1] : 1) > 7) fullHelp = fullHelp.split("\n").filter(l => !/^<b>ENABLE-DISABLE<\/b>/.test(l)).join("\n");
                    }
                    break;
                }
            }
        }

        hmiTooltipText.innerHTML = fullHelp || pageDescription(currentPage.key);
        hmiTooltip.classList.toggle("wide", (!!fullHelp && !isShortHelp) || isMotorPage);
    }
    hmiTooltip.style.display = "block";
    positionHmiTooltip(event);
}

function hideHmiTooltip() { hmiTooltip.style.display = "none"; }

hmiPanel.addEventListener("pointermove", showHmiTooltip);
hmiPanel.addEventListener("pointerdown", showHmiTooltip);
hmiPanel.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideHmiTooltip(); });
document.addEventListener("pointerdown", e => { if (!hmiPanel.contains(e.target)) hideHmiTooltip(); });

/* لمس: بار اول توضیح ۳ ثانیه نمایش داده می‌شود، لمس دوم (همان دکمه) وارد صفحه می‌شود */
/* زمان ورود خودکار به صفحه بعد از لمس (میلی‌ثانیه): 600 = یک ثانیه */
const AUTO_ENTER_MS = 600;
let lastPointerType = "mouse", armedButton = null, armedTimer = null, autoEnterTimer = null;
/* نگه داشتن انگشت (بیشتر از این مدت) فقط توضیح را نشان می‌دهد و وارد صفحه نمی‌شود (میلی‌ثانیه) */
const LONG_PRESS_MS = 400;
let downTime = 0;
hmiPanel.addEventListener("pointerdown", e => { lastPointerType = e.pointerType; downTime = performance.now(); touchDown = e.pointerType !== "mouse"; }, true);
function endTouch(e){
    if (e.pointerType === "mouse" || !touchDown) return;
    touchDown = false;
    clearTimeout(touchHideTimer);
    touchHideTimer = setTimeout(hideHmiTooltip, tooltipLong ? 15000 : 3000);   /* توضیح بعد از برداشتن انگشت ۳ ثانیه می‌ماند (توضیح بلند ۱۵ ثانیه) */
}
document.addEventListener("pointerup", endTouch, true);
document.addEventListener("pointercancel", endTouch, true);
hmiPanel.addEventListener("contextmenu", e => e.preventDefault());
hmiPanel.addEventListener("click", e => { if (e.target.closest("button")) hideLabels(); }, true);
hmiPanel.addEventListener("click", e => {
    if (lastPointerType === "mouse") return;
    if (e.isTrusted && performance.now() - downTime >= LONG_PRESS_MS) {      /* نگه داشتن = فقط توضیح */
        e.stopImmediatePropagation(); e.preventDefault();
        armedButton = null; clearTimeout(autoEnterTimer); clearTimeout(armedTimer);
        return;
    }
    const btn = e.target.closest("button");
    if (!btn || !hmiPanel.contains(btn) || btn.classList.contains("back-button")) return;
    clearTimeout(autoEnterTimer);
    if (armedButton === btn) { armedButton = null; clearTimeout(armedTimer); return; }
    e.stopImmediatePropagation(); e.preventDefault();
    armedButton = btn;
    clearTimeout(armedTimer);
    armedTimer = setTimeout(() => { armedButton = null; }, 3000);
    /* چند لحظه بعد از نمایش توضیح، خودکار وارد صفحه می‌شود (لمس دکمه‌ی دیگر آن را لغو می‌کند) */
    autoEnterTimer = setTimeout(() => { if (armedButton === btn) btn.click(); }, AUTO_ENTER_MS);
}, true);

/* تطبیق اندازه پنل با عرض صفحه (گوشی) */
function fitPanel() {
    const land = window.matchMedia("(orientation: landscape)").matches;
    const sc = window.screen, sMax = Math.max(sc.width||0, sc.height||0), sMin = Math.min(sc.width||0, sc.height||0);
    const vw = Math.min(window.innerWidth, (land ? sMax : sMin) || window.innerWidth);
    const vh = window.innerHeight;
    const ih = panelImage.offsetHeight || 625;
    const s = Math.min(1, vw / 1000, vh / ih);
    hmiPanel.style.transform = s < 1 ? "scale(" + s + ")" : "";
    hmiPanel.style.marginLeft = s < 1 ? Math.max(0, (vw - 1000 * s) / 2) + "px" : "";
    document.getElementById("fitWrap").style.height = s < 1 ? Math.ceil(ih * s) + "px" : "";
}
window.addEventListener("resize", fitPanel);
window.addEventListener("orientationchange", () => { fitPanel(); setTimeout(fitPanel, 300); });
panelImage.addEventListener("load", fitPanel);
fitPanel();
window.addEventListener("resize", hideHmiTooltip);
panelImage.addEventListener("load", hideHmiTooltip);

if (SHOW_BUTTONS) {
    hmiPanel.classList.add("debug-on");
    const coordBox = document.getElementById("coordBox");
    coordBox.style.display = "block";
    coordBox.textContent = "x: -  y: -";
    hmiPanel.addEventListener("pointermove", e => {
        const r = hmiPanel.getBoundingClientRect();
        const k = 1000 / r.width;
        coordBox.textContent = "x: " + Math.round((e.clientX - r.left) * k) + "   y: " + Math.round((e.clientY - r.top) * k);
    });
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
}

/* ساعت و تاریخ زنده (مثل HMI: M/D/YYYY و h:mm:ss AM/PM) */
(function(){
    const d1 = document.getElementById("hmiClockDate"), t1 = document.getElementById("hmiClockTime");
    function tick(){
        const n = new Date();
        d1.textContent = (n.getMonth()+1) + "/" + n.getDate() + "/" + n.getFullYear();
        let h = n.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
        const mm = String(n.getMinutes()).padStart(2,"0"), ss = String(n.getSeconds()).padStart(2,"0");
        t1.textContent = h + ":" + mm + ":" + ss + " " + ap;
    }
    tick(); setInterval(tick, 1000);
})();

hideSpecialButtons();
showMainMenu();
showLayoutButtons();
</script>

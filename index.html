    if (PAGE_DESCRIPTIONS[key]) return PAGE_DESCRIPTIONS[key];
    const m = key.match(/^M\d+(?:-[A-C])?-(.+)$/);
    if (m) { const hit = Object.keys(PAGE_DESCRIPTIONS).find(k => k.endsWith("-" + m[1])); if (hit) return PAGE_DESCRIPTIONS[hit]; }

function mk(cls, fn, data) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = cls;
    if (SHOW_BUTTONS && cls.split(' ').some(c => DEBUG_LABEL_CLASSES.includes(c))) {
        b.textContent = cls.split(' ').pop().toUpperCase();
    }
    if (data) Object.assign(b.dataset, data);
    b.addEventListener("click", fn);
    hmiPanel.appendChild(b);
    return b;
}

    pumps.forEach((k, i) => {
        const cls = n === 1 ? "melter-pump" + k : "melter" + n + "-pump" + (n === 4 ? i + 1 : k);

    MELTER_FILES["melter" + n + "-temp"] = "MELTER " + n + " TEMP";

});
Object.entries(MELTER_FILES).forEach(([cls, file]) => {
    const m = file.match(/^MELTER (\d+) (?:PUMP (\d+)|TEMP|PHASE?)$/);

    TOOLTIP_TEXTS[cls] = [file, "چسب زن " + FA_WORD[+m[1]] + " " + kind];
});

        ...melterPage5Buttons, ...melterPage6Buttons, ...melterImageButtons, ...melter5PhaseExtraButtons,
        ...melter5Page2Buttons, ...valvesButtons, ...valvesPage2Buttons, ...microReedButtons,
        ...microReedPage2Buttons, ...proportionalValveButtons, ...proportionalValvePage2Buttons,
        ".close-popup-button"
    ]);
}

function saveCurrentPage() {
    pageHistory.push({ key: currentPage.key, image: currentPage.image, state: currentPage.state });
    if (pageHistory.length > MAX_HISTORY) pageHistory.shift();
}
function navigateTo(key, image, state) {
    if (currentPage.key === key && currentPage.image === image) return;
    saveCurrentPage();
    currentPage = { key, image, state };
    panelImage.src = image;

    hmiPanel.classList.remove("page-module");
    if (MODULE_PAGES.includes(key)) hmiPanel.classList.add("page-module");

    hideHmiTooltip();
    restorePageState(state);
}

function restorePageState(state) {
    hideAllSpecial();
    if (state === "layout") { showMainMenu(); showLayoutButtons(); }
    else if (state === "normal") {
        if (MODULE_PAGES.includes(currentPage.key)) { 
            showSelectors(moduleButtons); 
            showSelectors(motorSelectorsForPage(currentPage.key)); 
        } else if (/^B[PC]\d\d(?:-.+)?$/.test(currentPage.key)) {
            // ✅ ضربدر فقط برای صفحاتی که توی لیست استثنا نیستن
            const hideClose = NO_CLOSE_BUTTON_PAGES.some(p => currentPage.key.startsWith(p));
            if (!hideClose) {
                showSelectors([".close-popup-button"]);
            }
        }
    }
    else if (state === "axes") { showButtons([".page-button"]); }
    else if (state === "vision-system") showSelectors(visionButtons);
    else if (state === "pressure-sensors") showSelectors(pressureSensorButtons);
    else if (state === "vacuum-sensors") showSelectors(vacuumSensorButtons);
    else if (state === "glue-sensors") showSelectors(glueSensorButtons);
    else if (state === "ifm-sensors") showSelectors(ifmButtons);
    else if (state === "asynchronous-motors") showSelectors([".asynchronous-motors-page2"]);
    else if (state === "asynchronous-motors-page2") showSelectors([".asynchronous-motors-page1"]);
    else if (state === "print-registration") showSelectors(printRegistrationButtons);
    else if (state === "unwinders") showSelectors([".unwinder-position-button"]);
    else if (state === "unwinder-setup") {
        const sel = unwinderBufferPageMap[currentPage.key];
        if (sel) showSelectors([sel]);
    }
    else if (state === "module-phasing") showSelectors(modulePhasingButtons);
    else if (state === "melter") { showSelectors(melterButtons); showSelectors(melterPumpButtons); }
    else if (state === "melter-page") {
        showSelectors(melterButtons);
        const pages = { "Melter PAGE 1":melterPumpButtons, "Melter PAGE 2":melterPage2Buttons, "Melter PAGE 3":melterPage3Buttons,
                        "Melter PAGE 4":melterPage4Buttons, "Melter PAGE 5":melterPage5Buttons, "Melter PAGE 6":melterPage6Buttons };
        if (pages[currentPage.key]) showSelectors(pages[currentPage.key]);
    }
    else if (state === "melter-phase") {
        const m = currentPage.key.match(/^MELTER (\d+) PHASE?$/);
        if (m) showSelectors([".melter" + m[1] + "-image"]);
        if (currentPage.key === "MELTER 5 PHASE") showSelectors(melter5PhaseExtraButtons);
    }
    else if (state === "melter5-page2") showSelectors(melter5Page2Buttons);
    else if (state === "valves") showSelectors(valvesButtons);
    else if (state === "valves-page2") showSelectors(valvesPage2Buttons);
    else if (state === "micro-reed") showSelectors(microReedButtons);
    else if (state === "micro-reed-page2") showSelectors(microReedPage2Buttons);
    else if (state === "proportional-valve") showSelectors(proportionalValveButtons);
    else if (state === "proportional-valve-page2") showSelectors(proportionalValvePage2Buttons);
    else if (state === "temperature-control" || state === "temperature-page") showTemperatureButtons([".temp-page1",".temp-page2",".resistances-check-button"]);
    else if (state === "resistances-check") showTemperatureButtons([".resistance-page1",".resistance-page2",".temperature-control-return-button"]);
    else if (state === "working-data-main") { showMainMenu(); showButtons([".current-shift-working-data",".knife-counters-working-data"]); }
    else if (state === "current-shift") { showMainMenu(); showButtons([".shift1-current-shift",".shift2-current-shift",".main-counter-current-shift"]); }
    else if (state === "shift1") { showMainMenu(); showButtons([".current-shift-shift1",".shift1-shift1",".shift2-shift1",".main-counter-shift1"]); }
    else if (state === "shift2") { showMainMenu(); showButtons([".current-shift-shift2",".shift1-shift2",".shift2-shift2",".main-counter-shift2"]); }
    else if (state === "active-alarm") showSelectors(activeAlarmButtons);
    else if (state === "alarm-list") showSelectors(alarmListButtons);
    else if (state === "alarm-history") showSelectors(alarmHistoryButtons);
    else if (state === "profinet") { showButtons([".advanced-diagnostic"]); }
    else if (state === "mechanical") { 
        /* ✅ فقط دکمه‌های هومینگ نمایش داده می‌شوند — هیچ دکمه‌ای از Layout بالای صفحه نمی‌آید */
        showSelectors(mechanicalButtons); 
    }
}

function goBack() {
    if (pageHistory.length === 0) return;
    const prev = pageHistory.pop();
    currentPage = { key: prev.key, image: prev.image, state: prev.state };
    panelImage.src = prev.image;
    hmiPanel.classList.remove("page-module");
    if (MODULE_PAGES.includes(prev.key)) hmiPanel.classList.add("page-module");
    hideHmiTooltip();
    restorePageState(prev.state);
}
function goHome(addToHistory = true) {
    if (currentPage.key === "Layout") { restorePageState("layout"); return; }
    if (addToHistory) saveCurrentPage();
    currentPage = { key:"Layout", image:"images/Layout.png", state:"layout" };
    panelImage.src = "images/Layout.png";
    hmiPanel.classList.remove("page-module");
    hideHmiTooltip();
    restorePageState("layout");
}

const hmiTooltip = document.getElementById("hmiTooltip");
const hmiTooltipTitle = document.getElementById("hmiTooltipTitle");
const hmiTooltipText = document.getElementById("hmiTooltipText");

function getTooltipDescription(button) {
    const classes = [...button.classList];
    for (const c of classes) if (TOOLTIP_TEXTS[c]) return TOOLTIP_TEXTS[c];
    const last = classes[classes.length - 1] || "";
    return [last.replace(/-/g, " ").toUpperCase() || "HMI BUTTON", ""];
}
document.body.appendChild(hmiTooltip);
function positionHmiTooltip(event) {
    const mx = event.clientX, my = event.clientY;
    const tw = hmiTooltip.offsetWidth, th = hmiTooltip.offsetHeight;
    const pw = window.innerWidth, ph = window.innerHeight;
    let left = mx + 16, top = my + 16;
    if (left + tw > pw - 5) left = mx - tw - 16;
    if (top + th > ph - 5) top = my - th - 16;
    hmiTooltip.style.left = Math.max(5, Math.min(left, pw - tw - 5)) + "px";
    hmiTooltip.style.top = Math.max(5, Math.min(top, ph - th - 5)) + "px";
}

let touchHideTimer = null;
function showHmiTooltip(event) {
    if (event.pointerType === "touch" || event.pointerType === "pen") {
        clearTimeout(touchHideTimer);
        const onBtn = event.target.closest && event.target.closest("button");
        touchHideTimer = setTimeout(hideHmiTooltip, onBtn ? 3000 : 5000);
    }
    const button = event.target.closest("button");
    if (button && hmiPanel.contains(button)) {
        const d = getTooltipDescription(button);
        hmiTooltipTitle.textContent = d[0];
        hmiTooltipText.textContent = d[1];
        hmiTooltip.classList.remove("wide");
    } else {
        hmiTooltipTitle.textContent = currentPage.key || "HMI";

        let fullHelp = "";
        let isMotorPage = false;
        let isShortHelp = false;

        const motorMatch = currentPage.key.match(/^M\d+(?:-[A-C])?-[A-Z]{2}\d+$/);
        if (motorMatch) {
            fullHelp = PAGE_FULL_HELP["Axes Configuration"];
            isMotorPage = true;
        } else if (/^B[PC]\d\d(?:-.+)?$/.test(currentPage.key) && TOOLTIP_TEXTS[currentPage.key.toLowerCase()]) {
            const t = TOOLTIP_TEXTS[currentPage.key.toLowerCase()];
            fullHelp = t[0] + " - " + t[1];
            isShortHelp = true;
        } else {
            for (const k in PAGE_FULL_HELP) {
                if (HELP_KEY_PATTERN[k] ? HELP_KEY_PATTERN[k].test(currentPage.key) : currentPage.key.toUpperCase().startsWith(k.toUpperCase())) {
                    fullHelp = PAGE_FULL_HELP[k];
                    if (k === "Axes") {
                        const am = currentPage.key.match(/^Axes Page (\d+)$/i);
                        if ((am ? +am[1] : 1) > 7) fullHelp = fullHelp.split("\n").filter(l => !/^<b>ENABLE-DISABLE<\/b>/.test(l)).join("\n");
                    }
                    break;
                }
            }
        }

        hmiTooltipText.innerHTML = fullHelp || pageDescription(currentPage.key);
        hmiTooltip.classList.toggle("wide", (!!fullHelp && !isShortHelp) || isMotorPage);
    }
    hmiTooltip.style.display = "block";
    positionHmiTooltip(event);
}

function hideHmiTooltip() { hmiTooltip.style.display = "none"; }

hmiPanel.addEventListener("pointermove", showHmiTooltip);
hmiPanel.addEventListener("pointerdown", showHmiTooltip);
hmiPanel.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hideHmiTooltip(); });
document.addEventListener("pointerdown", e => { if (!hmiPanel.contains(e.target)) hideHmiTooltip(); });

/* لمس: بار اول توضیح ۳ ثانیه نمایش داده می‌شود، لمس دوم (همان دکمه) وارد صفحه می‌شود */
/* زمان ورود خودکار به صفحه بعد از لمس (میلی‌ثانیه): 1000 = یک ثانیه */
const AUTO_ENTER_MS = 500;
let lastPointerType = "mouse", armedButton = null, armedTimer = null, autoEnterTimer = null;
hmiPanel.addEventListener("pointerdown", e => { lastPointerType = e.pointerType; }, true);
hmiPanel.addEventListener("click", e => {
    if (lastPointerType === "mouse") return;
    const btn = e.target.closest("button");
    if (!btn || !hmiPanel.contains(btn) || btn.classList.contains("back-button")) return;
    clearTimeout(autoEnterTimer);
    if (armedButton === btn) { armedButton = null; clearTimeout(armedTimer); return; }
    e.stopImmediatePropagation(); e.preventDefault();
    armedButton = btn;
    clearTimeout(armedTimer);
    armedTimer = setTimeout(() => { armedButton = null; }, 3000);
    /* چند لحظه بعد از نمایش توضیح، خودکار وارد صفحه می‌شود (لمس دکمه‌ی دیگر آن را لغو می‌کند) */
    autoEnterTimer = setTimeout(() => { if (armedButton === btn) btn.click(); }, AUTO_ENTER_MS);
}, true);

/* تطبیق اندازه پنل با عرض صفحه (گوشی) */
function fitPanel() {
    const land = window.matchMedia("(orientation: landscape)").matches;
    const sc = window.screen, sMax = Math.max(sc.width||0, sc.height||0), sMin = Math.min(sc.width||0, sc.height||0);
    const vw = Math.min(window.innerWidth, (land ? sMax : sMin) || window.innerWidth);
    const vh = window.innerHeight;
    const ih = panelImage.offsetHeight || 625;
    const s = Math.min(1, vw / 1000, vh / ih);
    hmiPanel.style.transform = s < 1 ? "scale(" + s + ")" : "";
    hmiPanel.style.marginLeft = s < 1 ? Math.max(0, (vw - 1000 * s) / 2) + "px" : "";
    document.getElementById("fitWrap").style.height = s < 1 ? Math.ceil(ih * s) + "px" : "";
}
window.addEventListener("resize", fitPanel);
window.addEventListener("orientationchange", () => { fitPanel(); setTimeout(fitPanel, 300); });
panelImage.addEventListener("load", fitPanel);
fitPanel();
window.addEventListener("resize", hideHmiTooltip);
panelImage.addEventListener("load", hideHmiTooltip);

if (SHOW_BUTTONS) {
    hmiPanel.classList.add("debug-on");
    const coordBox = document.getElementById("coordBox");
    coordBox.style.display = "block";
    coordBox.textContent = "x: -  y: -";
    hmiPanel.addEventListener("pointermove", e => {
        const r = hmiPanel.getBoundingClientRect();
        const k = 1000 / r.width;
        coordBox.textContent = "x: " + Math.round((e.clientX - r.left) * k) + "   y: " + Math.round((e.clientY - r.top) * k);
    });
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
}

hideSpecialButtons();
showMainMenu();
showLayoutButtons();

const ANCHOR_DESC = "/* ============================================================ */\n/* ====== توضیحات کامل صفحات";
const ANCHOR_ZONES = "let tooltipAnchor = null;";
const msg = document.getElementById("msg");
function say(t, c){ msg.className = c; msg.textContent = t; }
document.getElementById("f").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    let s = (await file.text()).replace(/\r\n/g, "\n");
    if (s.includes("Object.assign(PAGE_DESCRIPTIONS")) { say("قبلاً اعمال شده؛ تغییری داده نشد.", "err"); return; }
    if (s.split(ANCHOR_DESC).length !== 2 || s.split(ANCHOR_ZONES).length !== 2) { say("نقطهٔ درج پیدا نشد. فایل تغییر نکرد.", "err"); return; }
    s = s.replace(ANCHOR_DESC, () => BLOCK_DESCRIPTIONS + ANCHOR_DESC);
    s = s.replace(ANCHOR_ZONES, () => BLOCK_ZONES + ANCHOR_ZONES);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([s], {type:"text/html;charset=utf-8"}));
    a.download = "hmi.html";
    document.body.appendChild(a); a.click(); a.remove();
    say("انجام شد. فایل hmi.html دانلود شد.", "ok");
});
